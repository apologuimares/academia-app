<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bulk Log">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Bulk Log</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{border:none;background:none;cursor:pointer;color:inherit;font-family:inherit;-webkit-tap-highlight-color:transparent}
input{font-family:inherit;outline:none;-webkit-appearance:none}
input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none}
svg{display:block;flex-shrink:0}
:root{
  --bg:#0E1318;--sf:#141C24;--sf2:#1C2632;--bd:#263040;
  --tx:#E8E4DC;--tx2:#7A8898;
  --ru:#C45A1A;--rd:#8C4012;
  --ol:#6B9E52;--od:#4E7A3C;
  --ff:system-ui,-apple-system,sans-serif;
  --mo:ui-monospace,'Cascadia Code','Fira Code',monospace;
}
html,body{background:var(--bg);color:var(--tx);font-family:var(--ff);min-height:100svh;-webkit-tap-highlight-color:transparent}
#app{max-width:430px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;position:relative}
#bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--sf);border-top:1px solid var(--bd);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0)}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px}
.bn-ic{color:var(--tx2);transition:color .14s}
.bn-lb{font-size:.52rem;font-weight:700;letter-spacing:.08em;color:var(--tx2);text-transform:uppercase;transition:color .14s}
.bn.on .bn-ic,.bn.on .bn-lb{color:var(--ru)}
#content{flex:1;padding:0 16px 88px;overflow-y:auto}
#ex-detail{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column;max-width:430px;left:50%;transform:translateX(-50%)}
#ex-detail.open{display:flex}
.ed-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--bd)}
.ed-back{display:flex;align-items:center;gap:6px;color:var(--ru);font-size:.85rem;font-weight:700}
.ed-title{font-size:1rem;font-weight:800;flex:1}
.ed-body{flex:1;overflow-y:auto;padding:0 16px 16px}
.ed-musc-wrap{background:#0A1118;border-radius:12px;margin:14px 0;overflow:hidden}
.set-row{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;margin-bottom:6px}
.set-n{font-family:var(--mo);font-size:.8rem;color:var(--tx2);width:28px}
.set-in{flex:1;padding:6px 8px;border-radius:6px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);font-family:var(--mo);font-size:.85rem;text-align:center}
.set-done-btn{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--bd);flex-shrink:0;transition:background .12s,border-color .12s}
.set-done-btn.on{background:var(--ol);border-color:var(--ol)}
.add-set-btn{width:100%;padding:10px;border-radius:8px;border:1.5px dashed var(--bd);color:var(--tx2);font-size:.82rem;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}
.timer-big{display:flex;flex-direction:column;align-items:center;padding:16px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;margin-top:12px}
.timer-big-num{font-family:var(--mo);font-size:2.8rem;font-weight:800;color:var(--tx);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.timer-big-btn{margin-top:10px;padding:8px 28px;border-radius:8px;background:var(--ru);color:#fff;font-size:.82rem;font-weight:700;letter-spacing:.04em}
.h2{font-size:1.3rem;font-weight:900;letter-spacing:-.01em}
.sub{font-size:.72rem;color:var(--tx2);font-weight:600;letter-spacing:.06em;margin-top:2px}
.mono{font-family:var(--mo);font-variant-numeric:tabular-nums}
.dim{color:var(--tx2)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.nav-row{display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px}
.nav-row h2{font-size:1rem;font-weight:800}
.nav-btn{display:flex;align-items:center;gap:6px}
.nav-btn button{display:flex;padding:4px}
.dscroll{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
.dscroll::-webkit-scrollbar{display:none}
.dp{flex-shrink:0;padding:7px 14px;border-radius:8px;background:var(--sf);border:1px solid var(--bd);transition:background .1s,border-color .1s}
.dp.on{background:var(--ru);border-color:var(--ru)}
.dp-lb{font-size:.75rem;font-weight:800;letter-spacing:.06em}
.pstrip{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pbar{flex:1;height:3px;background:var(--bd);border-radius:2px;overflow:hidden}
.pfill{height:100%;background:var(--ol);border-radius:2px;transition:width .3s}
.pct{font-family:var(--mo);font-size:.72rem;color:var(--tx2);white-space:nowrap}
.ex{background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;transition:border-color .15s}
.ex.done{border-color:var(--od)}
.ex-top{display:flex;align-items:center;gap:10px;padding:11px 12px}
.chk{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;border:1px solid var(--tx2);flex-shrink:0;transition:background .12s,border-color .12s}
.chk.on{background:var(--ol);border-color:var(--ol)}
.ex-info{flex:1;min-width:0}
.ex-nm{font-size:.84rem;transition:color .15s}
.done .ex-nm{color:var(--tx2);text-decoration:line-through}
.ex-tg{font-family:var(--mo);font-size:.7rem;color:var(--tx2);margin-top:2px}
.ex-arr{color:var(--tx2);flex-shrink:0}
.ex-bot{display:flex;align-items:center;justify-content:space-between;padding:2px 12px 10px}
.hist-btn{display:flex;align-items:center;gap:5px;color:var(--tx2);font-size:.68rem}
.timer-b{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;border:1px solid var(--bd);font-family:var(--mo);font-size:.68rem;color:var(--tx2);transition:background .1s}
.timer-b.run{background:var(--rd);border-color:var(--rd);color:#fff}
.ex-hist{padding:8px 12px 10px;border-top:1px solid var(--bd)}
.hrow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd)}
.hrow:last-child{border-bottom:none}
.hrow-date{font-size:.72rem;color:var(--tx2)}
.hrow-val{font-family:var(--mo);font-size:.76rem}
.wlbls{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px}
.wlbl{font-size:.6rem;font-weight:700;color:var(--tx2);text-align:center;text-transform:uppercase;letter-spacing:.04em}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cc{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:7px;border:1px solid transparent}
.cc.today{background:var(--sf);border-color:var(--bd)}
.cc.click{cursor:pointer}
.cc-num{font-family:var(--mo);font-size:.73rem}
.cc-badge{font-family:var(--mo);font-size:.52rem;padding:1px 5px;border-radius:10px;font-weight:700;color:var(--bg);font-variant-numeric:tabular-nums}
.cc-dot{width:5px;height:5px;border-radius:50%;background:var(--bd)}
.legend{display:flex;gap:16px;margin-top:16px}
.li{display:flex;align-items:center;gap:6px;font-size:.73rem;color:var(--tx2)}
.ld{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dtypes{display:flex;gap:8px;padding:14px 0}
.dt{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:8px;background:var(--sf);border:1px solid var(--bd);transition:background .1s}
.dt.on{background:var(--ru);border-color:var(--ru)}
.dt-lb{font-size:.6rem;font-weight:700;letter-spacing:.04em;text-align:center;text-transform:capitalize;line-height:1.3}
.meal{display:flex;align-items:flex-start;gap:11px;padding:12px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;transition:border-color .12s}
.meal.done{border-color:var(--od)}
.mchk{width:21px;height:21px;border-radius:5px;display:flex;align-items:center;justify-content:center;border:1px solid var(--tx2);flex-shrink:0;margin-top:2px;transition:background .12s}
.mchk.on{background:var(--ol);border-color:var(--ol)}
.meal-cat{font-size:.62rem;font-weight:700;color:var(--tx2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.meal-nm{font-size:.84rem;transition:color .15s}
.meal.done .meal-nm{color:var(--tx2)}
.meal-meta{font-family:var(--mo);font-size:.7rem;color:var(--tx2);margin-top:3px}
.macro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.macro-card{background:var(--sf2);border-radius:10px;padding:12px 8px;text-align:center}
.macro-val{font-family:var(--mo);font-size:1.25rem;font-weight:700;line-height:1}
.macro-lbl{font-size:.65rem;color:var(--tx2);margin-top:4px;letter-spacing:.04em}
.macro-bar{height:4px;border-radius:2px;background:var(--bd);margin-top:8px;overflow:hidden}
.macro-fill{height:100%;border-radius:2px;transition:width .3s}
.custom-food{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.cf-row{display:flex;gap:6px;margin-top:8px}
.cf-in{flex:1;padding:7px 10px;border-radius:7px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);font-family:var(--mo);font-size:.82rem;min-width:0}
.cf-add{padding:7px 14px;border-radius:7px;background:var(--ru);color:#fff;font-size:.8rem;font-weight:700;flex-shrink:0}
.cf-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd);font-size:.8rem}
.cf-item:last-child{border-bottom:none}
.cf-del{color:var(--tx2);font-size:.75rem}
.w-row{display:flex;gap:8px;margin-bottom:18px}
.w-in{flex:1;border-radius:8px;padding:10px 12px;background:var(--sf);color:var(--tx);border:1px solid var(--bd);font-family:var(--mo);font-size:.95rem}
.w-in::placeholder{color:var(--bd)}
.w-add{display:flex;align-items:center;justify-content:center;border-radius:8px;padding:0 20px;background:var(--ru)}
.chart-wrap{padding:16px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;margin-bottom:14px}
.chart-bars{display:flex;align-items:flex-end;gap:3px;height:96px}
.wlog-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
.wlog-row:last-child{border-bottom:none}
.wlog-date{font-size:.8rem;color:var(--tx2)}
.wlog-val{font-family:var(--mo);font-size:.84rem}
.empty-s{text-align:center;padding:32px 0}
.pr-badge{display:inline-flex;align-items:center;gap:3px;background:#3A2800;color:#FFB038;font-size:.58rem;font-weight:800;padding:2px 8px;border-radius:10px;letter-spacing:.05em;vertical-align:middle;flex-shrink:0}
.streak-card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:16px}
.streak-num{font-family:var(--mo);font-size:2.4rem;font-weight:900;color:var(--ru);line-height:1;min-width:50px}
.ws-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.ws-card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px}
.ws-val{font-family:var(--mo);font-size:1.35rem;font-weight:800}
.ws-lbl{font-size:.63rem;color:var(--tx2);letter-spacing:.04em;margin-top:2px;text-transform:uppercase}
.ws-diff{font-family:var(--mo);font-size:.68rem;margin-top:5px}
.goal-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.goal-lbl{font-size:.72rem;color:var(--tx2);min-width:80px}
.goal-bar-wrap{flex:1;height:6px;background:var(--bd);border-radius:3px;overflow:hidden}
.goal-fill{height:100%;border-radius:3px;background:var(--ol);transition:width .3s}
.goal-pct{font-family:var(--mo);font-size:.7rem;color:var(--tx2);min-width:44px;text-align:right}
.med-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.med-inp{width:100%;padding:8px 10px;border-radius:8px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);font-family:var(--mo);font-size:.88rem;text-align:right}
.med-lbl{font-size:.63rem;color:var(--tx2);font-weight:700;margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase}
.med-log-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);gap:8px}
.med-log-row:last-child{border-bottom:none}
.achv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.achv-item{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.achv-item.unlocked{border-color:var(--ol);background:rgba(107,158,82,.10)}
.achv-item.locked .achv-icon{filter:grayscale(1);opacity:.35}
.achv-item.locked .achv-nm,.achv-item.locked .achv-desc{color:var(--tx2)}
.achv-icon{font-size:1.5rem;line-height:1}
.achv-nm{font-size:.72rem;font-weight:800;line-height:1.2}
.achv-desc{font-size:.62rem;color:var(--tx2);line-height:1.3}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.sec-title{font-size:.88rem;font-weight:800}
.btn-sm{padding:5px 12px;border-radius:7px;background:var(--sf);border:1px solid var(--bd);font-size:.72rem;font-weight:700;color:var(--tx2)}
.exp-btn{width:100%;padding:12px;border-radius:10px;background:var(--sf);border:1px solid var(--bd);font-size:.82rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;color:var(--tx)}
/* ── Tema claro ── */
:root.light{--bg:#F5F2EC;--sf:#FFFFFF;--sf2:#EDE9E0;--bd:#D5D0C8;--tx:#1A1A1A;--tx2:#6B6560;--ru:#C45A1A;--rd:#9E440E;--ol:#4E7A3C;--od:#3D6030}
/* ── Animações ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.tab-anim{animation:fadeUp .18s ease both}
/* ── Onboarding ── */
#onboarding{position:fixed;inset:0;background:var(--bg);z-index:600;display:flex;align-items:center;justify-content:center;max-width:430px;left:50%;transform:translateX(-50%);transition:opacity .3s}
#onboarding.hidden{display:none}
.onb-body{display:flex;flex-direction:column;align-items:center;padding:28px 24px 36px;text-align:center;gap:0;width:100%;max-width:360px}
.onb-icon{width:80px;height:80px;border-radius:20px;margin-bottom:20px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.onb-title{font-size:1.9rem;font-weight:900;letter-spacing:-.02em;margin-bottom:6px}
.onb-sub{font-size:.88rem;color:var(--tx2);margin-bottom:24px;line-height:1.5}
.onb-steps{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;margin-bottom:28px}
.onb-step{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:11px 14px}
.onb-step-ic{font-size:1.25rem;flex-shrink:0;width:28px;text-align:center}
.onb-step-tx{font-size:.83rem;line-height:1.35}
.onb-btn{width:100%;padding:15px;border-radius:12px;background:var(--ru);color:#fff;font-size:1rem;font-weight:800;letter-spacing:.02em}
/* ── Botão tema ── */
#theme-btn{position:fixed;top:14px;right:12px;z-index:300;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;font-size:.72rem;font-weight:700;color:var(--tx2);display:flex;align-items:center;gap:5px}
@media(min-width:454px){#theme-btn{right:calc(50vw - 203px)}}
/* ── Fotos ── */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--sf2)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);border-radius:6px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.75rem;line-height:1}
.photo-date{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.7));padding:3px 5px;font-size:.52rem;color:#fff;text-align:center}
.photo-add-btn{aspect-ratio:1;border-radius:8px;border:1.5px dashed var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--tx2);font-size:.65rem;font-weight:700;cursor:pointer;background:transparent}
</style>
</head>
<body>
<div id="app">
  <div id="content"></div>
  <nav id="bnav"></nav>
</div>
<div id="ex-detail">
  <div class="ed-head">
    <button class="ed-back" data-close-detail>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Treino
    </button>
    <span class="ed-title" id="ed-exname"></span>
  </div>
  <div class="ed-body">
    <div id="ed-media"></div>
    <div style="margin:16px 0 10px;display:flex;align-items:baseline;gap:8px">
      <span style="font-size:1rem;font-weight:800">Séries</span>
      <span id="ed-sets-done" style="font-family:var(--mo);font-size:.85rem;color:var(--tx2)"></span>
    </div>
    <div id="ed-sets-list"></div>
    <button class="add-set-btn" id="ed-add-set">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Adicionar série
    </button>
    <div class="timer-big" style="margin-top:16px">
      <div style="font-size:.7rem;font-weight:700;color:var(--tx2);letter-spacing:.08em;margin-bottom:4px">DESCANSO</div>
      <div class="timer-big-num" id="ed-timer-num">90s</div>
      <button class="timer-big-btn" id="ed-timer-btn">Iniciar</button>
    </div>
  </div>
</div>

<!-- Onboarding -->
<div id="onboarding" class="hidden">
  <div class="onb-body">
    <img class="onb-icon" src="./icon-192.png" alt="Bulk Log">
    <div class="onb-title">Bulk Log</div>
    <div class="onb-sub">Registre treinos, dieta e progresso.<br>Simples, rápido, offline.</div>
    <div class="onb-steps">
      <div class="onb-step"><span class="onb-step-ic">🏋️</span><span class="onb-step-tx"><b>Treino diário</b> com timer e registro de séries</span></div>
      <div class="onb-step"><span class="onb-step-ic">🏆</span><span class="onb-step-tx"><b>Recordes pessoais</b> detectados automaticamente</span></div>
      <div class="onb-step"><span class="onb-step-ic">📊</span><span class="onb-step-tx"><b>Progresso</b> de peso, medidas e fotos</span></div>
    </div>
    <button class="onb-btn" id="onb-start">Começar →</button>
  </div>
</div>

<!-- Tema -->
<button id="theme-btn" title="Alternar tema"></button>

<!-- Input fotos (oculto) -->
<input type="file" id="photo-input" accept="image/*" style="display:none">

<script>
'use strict';
const DAYS=[
  {id:'mon',lb:'SEG',full:'Segunda',focus:'Peito · Ombro · Tríceps',wd:1},
  {id:'tue',lb:'TER',full:'Terça',focus:'Costas · Bíceps · Trapézio',wd:2},
  {id:'wed',lb:'QUA',full:'Quarta',focus:'Perna completa',wd:3},
  {id:'thu',lb:'QUI',full:'Quinta',focus:'Peito · Ombro · Tríceps',wd:4},
  {id:'fri',lb:'SEX',full:'Sexta',focus:'Costas · Perna · Bíceps · Core',wd:5},
];

function getPR(exId){return DB.get('pr:'+exId)||null;}
function checkAndSavePR(exId,kg,reps){
  if(!kg||kg<=0)return false;
  const pr=getPR(exId)||{kg:0,reps:0,date:''};
  if(kg>pr.kg||(kg===pr.kg&&reps>(pr.reps||0))){
    DB.set('pr:'+exId,{kg,reps:reps||0,date:todayISO()});

}

// ── Streak (sequência de semanas) ──────────────────────────────
function calcStreak(){
  const weeks=new Set();
  DB.keys('workout:').forEach(k=>{const p=k.split(':');if(p.length===3){const log=DB.get(k);if(log&&Object.values(log).some(ex=>ex?.done))weeks.add(mondayOf(new Date(p[1])).toISOString().slice(0,10));}});
  let n=0,ch=mondayOf(new Date());
  while(true){if(weeks.has(ch.toISOString().slice(0,10))){n++;ch=new Date(ch);ch.setDate(ch.getDate()-7);}else break;}
  return n;
}

function weeklyStats(){
  function wd(mon){const end=new Date(mon);end.setDate(end.getDate()+6);const days=new Set();let sets=0;DB.keys('workout:').forEach(k=>{const p=k.split(':');if(p.length===3){const d=new Date(p[1]);if(d>=mon&&d<=end){const log=DB.get(k);if(log&&Object.values(log).some(ex=>ex?.done)){days.add(p[1]);Object.values(log).forEach(ex=>{if(ex?.sets)sets+=ex.sets.filter(s=>s.done).length;});}}}});return{workouts:days.size,sets};}
  const mon=mondayOf(new Date());const prev=new Date(mon);prev.setDate(prev.getDate()-7);

}

  if(pts.length<2)return'';

}

function calcAchievements(){
  const u=new Set();
  const days=new Set();
  DB.keys('workout:').forEach(k=>{const p=k.split(':');if(p.length===3){const log=DB.get(k);if(log&&Object.values(log).some(e=>e?.done))days.add(p[1]);}});
  if(days.size>=1)u.add('first_workout');
  if(days.size>=10)u.add('total_10');
  if(days.size>=50)u.add('total_50');
  if(DB.keys('pr:').length>0)u.add('first_pr');
  const sk=calcStreak();
  if(sk>=1)u.add('streak_1');if(sk>=3)u.add('streak_3');if(sk>=5)u.add('streak_5');if(sk>=10)u.add('streak_10');
  const ws=weeklyStats();
  if(ws.cur.sets>=50)u.add('sets_50week');
  if(ws.cur.workouts>=getGoals().workouts)u.add('goal_met');
  return u;
}

function exportCSV(){
  const rows=[['Data','Dia','Exercício','Série','Kg','Reps','Feito']];
  DB.keys('workout:').sort().forEach(k=>{
    const p=k.split(':');if(p.length!==3)return;
    const[,date,dayId]=p;const log=DB.get(k);if(!log)return;
    const day=DAYS.find(d=>d.id===dayId);
    Object.entries(log).forEach(([exId,entry])=>{
      const ex=(WORKOUTS[dayId]||[]).find(e=>e.id===exId);
      if(entry?.sets){entry.sets.forEach((s,i)=>{rows.push([date,day?.lb||dayId,ex?.n||exId,i+1,s.kg||'',s.reps||'',s.done?'Sim':'Não']);});}
      else if(entry?.done){rows.push([date,day?.lb||dayId,ex?.n||exId,1,entry.weight||'',entry.reps||'',entry.done?'Sim':'Não']);}
    });
  });
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,﻿'+encodeURIComponent(csv);a.download='bulk-log-treinos.csv';document.body.appendChild(a);a.click();a.remove();
}

  const customRows=custom.map((c,i)=>`<div class="cf-item"><span>${c.nm} — ${c.kcal||0} kcal, ${c.prot||0}g prot</span><button class="cf-del" data-del-custom="${i}">${ico('trash',13,'#7A8898')}</button></div>`).join('');
  return`<div class="dtypes">${pills}</div><div class="macro-grid"><div class="macro-card"><div class="macro-val" style="color:${overKcal?'#C45A1A':'#E8E4DC'}">${kcal.toLocaleString('pt-BR')}</div><div class="macro-lbl">kcal · meta ${dt.tgtKcal.toLocaleString('pt-BR')}</div><div class="macro-bar"><div class="macro-fill" style="width:${pctKcal}%;background:${overKcal?'#C45A1A':'#6B9E52'}"></div></div>${faltaKcal>0?`<div style="font-size:.6rem;color:var(--tx2);margin-top:5px">Faltam ${faltaKcal} kcal</div>`:`<div style="font-size:.6rem;color:var(--ol);margin-top:5px">Meta atingida</div>`}</div><div class="macro-card"><div class="macro-val" style="color:${overProt?'#C45A1A':'#E8E4DC'}">${prot}g</div><div class="macro-lbl">proteína · meta ${dt.tgtProt}g</div><div class="macro-bar"><div class="macro-fill" style="width:${pctProt}%;background:${overProt?'#C45A1A':'#6B9E52'}"></div></div>${faltaProt>0?`<div style="font-size:.6rem;color:var(--tx2);margin-top:5px">Faltam ${faltaProt}g prot</div>`:`<div style="font-size:.6rem;color:var(--ol);margin-top:5px">Meta atingida</div>`}</div><div class="macro-card"><div class="macro-val">${carb}g</div><div class="macro-lbl">carb</div><div class="macro-bar"><div class="macro-fill" style="width:${Math.min(100,(carb/400)*100)}%;background:#4A7AB8"></div></div><div style="font-size:.6rem;color:var(--tx2);margin-top:5px">${fat}g gordura</div></div></div><div class="custom-food"><div style="font-size:.78rem;font-weight:700;margin-bottom:2px">Adicionar alimento extra</div><div style="font-size:.7rem;color:var(--tx2)">Fugiu da dieta? Adicione aqui.</div><div class="cf-row"><input class="cf-in" id="cf-nm" placeholder="Nome" style="flex:2"><input class="cf-in" id="cf-kcal" type="number" inputmode="numeric" placeholder="kcal" style="flex:1"><input class="cf-in" id="cf-prot" type="number" inputmode="numeric" placeholder="prot g" style="flex:1"><button class="cf-add" data-add-custom>OK</button></div>${customRows?`<div style="margin-top:8px">${customRows}</div>`:''}</div>${mealCards}`;
}
function renderProgresso(){
  const entries=DB.get('weight-log')||[];const maxW=Math.max(...entries.map(e=>e.weight),0);const minW=Math.min(...entries.map(e=>e.weight),maxW);const range=maxW-minW||1;
  let chartHtml='';
  if(entries.length>0){const last=entries.slice(-14);const bars=last.map((e,i)=>{const h=((e.weight-minW)/range)*82+14;return`<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="width:70%;margin:0 auto;height:${h}%;background:${i===last.length-1?'#C45A1A':'#263040'};border-radius:3px 3px 0 0"></div></div>`;}).join('');chartHtml=`<div class="chart-wrap"><div class="chart-bars">${bars}</div><div style="display:flex;justify-content:space-between;margin-top:8px"><span style="font-family:var(--mo);font-size:.67rem;color:var(--tx2)">${entries[Math.max(0,entries.length-14)].date.slice(5)}</span><span style="font-family:var(--mo);font-size:.67rem;color:var(--tx2)">${entries[entries.length-1].date.slice(5)}</span></div></div>`;}
  else{chartHtml=`<div class="card empty-s">${ico('trend',28,'#7A8898')}<p class="dim" style="font-size:.85rem;margin-top:8px">Nenhum registro ainda</p></div>`;}
  const logRows=[...entries].reverse().slice(0,8).map(e=>`<div class="wlog-row"><span class="wlog-date">${e.date}</span><span class="wlog-val mono">${e.weight} kg</span></div>`).join('');
  const lastMed=getLastMedidas();
  const medInputs=MEDIDAS_CAMPOS.map(c=>`<div><div class="med-lbl">${c.lb} (${c.un})</div><input class="med-inp" id="mi-${c.id}" type="number" inputmode="decimal" placeholder="—" value="${lastMed?.data?.[c.id]||''}"></div>`).join('');
  const medKeys=DB.keys('medidas:').sort().reverse();
  const medLog=medKeys.slice(0,4).map(k=>{const d=DB.get(k);const flds=MEDIDAS_CAMPOS.filter(c=>d[c.id]).map(c=>`${c.lb}: ${d[c.id]}`).join(' · ');return`<div class="med-log-row"><span style="font-size:.72rem;color:var(--tx2);flex-shrink:0">${k.slice(8)}</span><span style="font-size:.68rem;flex:1;padding-left:8px;text-align:right;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${flds}</span></div>`;}).join('');
  const medidasSection=`<div class="sec-head"><span class="sec-title">Medidas Corporais</span>${lastMed?`<span style="font-size:.68rem;color:var(--tx2)">${lastMed.date}</span>`:''}</div><div class="med-grid">${medInputs}</div><button data-save-medidas style="width:100%;padding:10px;border-radius:8px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);font-weight:700;font-size:.82rem;margin-bottom:${medLog?'0':'14px'}">Salvar medidas</button>${medLog?`<div style="margin:6px 0 14px">${medLog}</div>`:''}`;
  const unlocked=calcAchievements();
  const achvsSection=`<div class="sec-head"><span class="sec-title">Conquistas</span><span style="font-size:.72rem;color:var(--tx2)">${unlocked.size}/${ACHVS.length}</span></div><div class="achv-grid">${ACHVS.map(a=>{const on=unlocked.has(a.id);return`<div class="achv-item${on?' unlocked':' locked'}"><div class="achv-icon">${a.icon}</div><div class="achv-nm">${a.name}</div><div class="achv-desc">${a.desc}</div></div>`;}).join('')}</div>`;
  return`<div style="padding:20px 0 14px"><div class="h2">Progresso</div><div class="sub">Peso corporal — ganho de massa</div></div><div class="w-row"><input class="w-in" id="w-input" type="number" inputmode="decimal" placeholder="Peso hoje (kg)" value="${S.wInput}"><button class="w-add" data-add-weight>${ico('plus',20,'#E8E4DC')}</button></div>${chartHtml}${logRows}${medidasSection}${renderPhotos()}${achvsSection}<button data-export-csv class="exp-btn">${ico('download',16,'#7A8898')} Exportar treinos (CSV)</button>`;
}
function renderContent(){switch(S.tab){case'painel':return renderPainel();case'treino':return renderTreino();case'musculos':return renderMusculos();case'dieta':return renderDieta();case'progresso':return renderProgresso();}}
function mount(){document.getElementById('bnav').innerHTML=renderNav();const c=document.getElementById('content');c.innerHTML=renderContent();c.classList.remove('tab-anim');requestAnimationFrame(()=>c.classList.add('tab-anim'));}
function remountContent(){document.getElementById('content').innerHTML=renderContent();}
function openDetail(exId,dayId){
  const exs=WORKOUTS[dayId]||[];const ex=exs.find(e=>e.id===exId);if(!ex)return;
  S.detailEx=exId;S.detailDay=dayId;
  document.getElementById('ed-exname').textContent=ex.n;
  const muss=EX_MUS[exId]||[];
  const gifId=EX_GIF[exId];
  const mediaEl=document.getElementById('ed-media');
  if(gifId){
    const badges=muss.map(g=>`<span style="background:var(--sf2);color:#35CC60;font-size:.62rem;font-weight:700;padding:3px 9px;border-radius:6px;letter-spacing:.05em;text-transform:uppercase">${MLBL[g]}</span>`).join('');
    mediaEl.innerHTML=`<div style="background:#0A1118;border-radius:12px;overflow:hidden;margin:14px 0"><img id="ed-gif" src="${_GB}${gifId}/0.gif" alt="${ex.n}" style="width:100%;max-height:220px;object-fit:contain;display:block"><div style="padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px">${badges}</div></div>`;
    const img=document.getElementById('ed-gif');
    if(img)img.onerror=()=>{mediaEl.innerHTML=`<div class="ed-musc-wrap">${buildBodySVG({},1,muss)}</div>`;};
  }else{
    mediaEl.innerHTML=`<div class="ed-musc-wrap">${buildBodySVG({},1,muss)}</div>`;
  }
  renderDetailSets();document.getElementById('ex-detail').classList.add('open');
  detailTimer={rem:null,iid:null};document.getElementById('ed-timer-num').textContent='90s';document.getElementById('ed-timer-btn').textContent='Iniciar';
}
function renderDetailSets(){const skey=`workout:${todayISO()}:${S.detailDay}`;const log=DB.get(skey)||{};const sets=log[S.detailEx]?.sets||[];const done=sets.filter(s=>s.done).length;document.getElementById('ed-sets-done').textContent=`${done}/${sets.length} séries`;document.getElementById('ed-sets-list').innerHTML=sets.map((s,i)=>`<div class="set-row"><span class="set-n">Série ${i+1}</span><input class="set-in" type="number" inputmode="decimal" placeholder="kg" value="${s.kg||''}" data-set-kg="${i}"><input class="set-in" type="number" inputmode="numeric" placeholder="reps" value="${s.reps||''}" data-set-reps="${i}"><button class="set-done-btn${s.done?' on':''}" data-set-done="${i}">${s.done?chkSvg(13):''}</button></div>`).join('');}
function detailSaveSet(idx,field,val){const skey=`workout:${todayISO()}:${S.detailDay}`;const log=DB.get(skey)||{};const sets=[...(log[S.detailEx]?.sets||[])];if(!sets[idx])sets[idx]={};sets[idx][field]=val;DB.set(skey,{...log,[S.detailEx]:{...log[S.detailEx],sets}});}
function closeDetail(){document.getElementById('ex-detail').classList.remove('open');if(detailTimer.iid){clearInterval(detailTimer.iid);detailTimer={rem:null,iid:null};}S.detailEx=null;S.detailDay=null;}
function startTimer(exId){if(TIMERS[exId]?.iid)clearInterval(TIMERS[exId].iid);TIMERS[exId]={rem:90,iid:null};TIMERS[exId].iid=setInterval(()=>{if(!TIMERS[exId])return;TIMERS[exId].rem--;const lbl=document.getElementById(`tl-${exId}`);if(lbl)lbl.textContent=TIMERS[exId].rem+'s';if(TIMERS[exId].rem<=0){clearInterval(TIMERS[exId].iid);TIMERS[exId]={rem:null,iid:null};const btn=document.getElementById(`timer-${exId}`);if(btn)btn.classList.remove('run');if(lbl)lbl.textContent='90s';beepSound();if(navigator.vibrate)navigator.vibrate([200,100,200]);}},1000);}
function startDetailTimer(){if(detailTimer.iid)clearInterval(detailTimer.iid);detailTimer.rem=90;const numEl=document.getElementById('ed-timer-num');const btnEl=document.getElementById('ed-timer-btn');if(btnEl)btnEl.textContent='Parar';detailTimer.iid=setInterval(()=>{detailTimer.rem--;if(numEl)numEl.textContent=detailTimer.rem+'s';if(detailTimer.rem<=0){clearInterval(detailTimer.iid);detailTimer={rem:null,iid:null};if(numEl)numEl.textContent='90s';if(btnEl)btnEl.textContent='Iniciar';beepSound();if(navigator.vibrate)navigator.vibrate([200,100,200]);}},1000);}
document.addEventListener('click',e=>{
  const t=e.target;
  const nb=t.closest('[data-tab]');if(nb){S.tab=nb.dataset.tab;S.histEx=null;mount();return;}
  const tog=t.closest('[data-toggle]');if(tog){const exId=tog.dataset.toggle,skey=tog.dataset.skey;const log=DB.get(skey)||{};const done=!log[exId]?.done;DB.set(skey,{...log,[exId]:{...log[exId],done}});const card=document.getElementById(`ex-${exId}`);if(card){card.className=`ex${done?' done':''}`;const chk=card.querySelector('.chk');if(chk){chk.className=`chk${done?' on':''}`;chk.innerHTML=done?chkSvg():'';}}const exs=WORKOUTS[S.treinoDay];const dc=exs.filter(e=>(DB.get(skey)||{})[e.id]?.done).length;const pf=document.getElementById('pfill'),pl=document.getElementById('pct-lbl');if(pf)pf.style.width=`${(dc/exs.length)*100}%`;if(pl)pl.textContent=`${dc}/${exs.length}`;return;}
  const od=t.closest('[data-open-detail]');if(od){openDetail(od.dataset.openDetail,od.dataset.detailDay);return;}
  const hist=t.closest('[data-hist]');if(hist){S.histEx=S.histEx===hist.dataset.hist?null:hist.dataset.hist;remountContent();return;}
  const timerBtn=t.closest('[data-timer]');if(timerBtn){const exId=timerBtn.dataset.timer,tm=TIMERS[exId];if(tm?.iid){clearInterval(tm.iid);TIMERS[exId]={rem:null,iid:null};timerBtn.classList.remove('run');const l=document.getElementById(`tl-${exId}`);if(l)l.textContent='90s';}else{startTimer(exId);timerBtn.classList.add('run');}return;}
  const dp=t.closest('[data-day]');if(dp){S.treinoDay=dp.dataset.day;S.histEx=null;remountContent();return;}
  if(t.closest('[data-cal-prev]')){let{calYear:y,calMonth:m}=S;m--;if(m<0){m=11;y--;}S.calYear=y;S.calMonth=m;remountContent();return;}
  if(t.closest('[data-cal-next]')){let{calYear:y,calMonth:m}=S;m++;if(m>11){m=0;y++;}S.calYear=y;S.calMonth=m;remountContent();return;}
  const cd=t.closest('[data-cal-day]');if(cd&&cd.dataset.calDay){S.tab='treino';S.treinoDay=cd.dataset.calDay;S.histEx=null;mount();return;}
  if(t.closest('[data-musc-prev]')){const d=new Date(S.muscWeek);d.setDate(d.getDate()-7);S.muscWeek=d;remountContent();return;}
  if(t.closest('[data-musc-next]')){const d=new Date(S.muscWeek);d.setDate(d.getDate()+7);S.muscWeek=d;remountContent();return;}
  const dt=t.closest('[data-diet-type]');if(dt){S.dietType=dt.dataset.dietType;remountContent();return;}
  const meal=t.closest('[data-meal]');if(meal){const mId=meal.dataset.meal,skey=meal.dataset.dietSkey;const ch=DB.get(skey)||{};DB.set(skey,{...ch,[mId]:!ch[mId]});remountContent();return;}
  if(t.closest('[data-add-custom]')){const nm=document.getElementById('cf-nm')?.value.trim();const kcal=parseInt(document.getElementById('cf-kcal')?.value)||0;const prot=parseInt(document.getElementById('cf-prot')?.value)||0;if(!nm)return;const key=`diet-custom:${todayISO()}`;DB.set(key,[...(DB.get(key)||[]),{nm,kcal,prot}]);remountContent();return;}
  const dc2=t.closest('[data-del-custom]');if(dc2){const idx=parseInt(dc2.dataset.delCustom);const key=`diet-custom:${todayISO()}`;const list=DB.get(key)||[];list.splice(idx,1);DB.set(key,list);remountContent();return;}
  if(t.closest('[data-add-weight]')){const inp=document.getElementById('w-input');if(!inp)return;const val=parseFloat(inp.value.replace(',','.'));if(!val||val<=0)return;const entries=[...(DB.get('weight-log')||[]),{date:todayISO(),weight:val}].sort((a,b)=>a.date>b.date?1:-1);DB.set('weight-log',entries);S.wInput='';remountContent();return;}
  if(t.closest('[data-save-medidas]')){const vals={};MEDIDAS_CAMPOS.forEach(c=>{const el=document.getElementById('mi-'+c.id);if(el&&el.value)vals[c.id]=parseFloat(el.value.replace(',','.'));});if(Object.keys(vals).length)DB.set('medidas:'+todayISO(),vals);remountContent();return;}
  if(t.closest('[data-export-csv]')){exportCSV();return;}
  if(t.closest('[data-edit-goals]')){S.editingGoals=!S.editingGoals;remountContent();return;}
  if(t.closest('[data-save-goals]')){const w=parseInt(document.getElementById('gl-w')?.value)||4;const s=parseInt(document.getElementById('gl-s')?.value)||40;DB.set('goals',{workouts:Math.max(1,w),sets:Math.max(1,s)});S.editingGoals=false;remountContent();return;}
  if(t.closest('[data-add-photo]')){document.getElementById('photo-input').click();return;}
  const dp2=t.closest('[data-del-photo]');if(dp2){const idx=parseInt(dp2.dataset.delPhoto);const photos=DB.get('progress-photos')||[];photos.splice(idx,1);DB.set('progress-photos',photos);remountContent();return;}
});
document.addEventListener('input',e=>{if(e.target.id==='w-input')S.wInput=e.target.value;});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='w-input')document.querySelector('[data-add-weight]')?.click();if(e.key==='Escape')closeDetail();});
document.getElementById('ex-detail').addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-close-detail]')){closeDetail();return;}
  if(t.closest('#ed-timer-btn')){if(detailTimer.iid){clearInterval(detailTimer.iid);detailTimer={rem:null,iid:null};document.getElementById('ed-timer-num').textContent='90s';document.getElementById('ed-timer-btn').textContent='Iniciar';}else{startDetailTimer();}return;}
  if(t.closest('#ed-add-set')){const skey=`workout:${todayISO()}:${S.detailDay}`;const log=DB.get(skey)||{};const sets=[...(log[S.detailEx]?.sets||[]),{kg:'',reps:'',done:false}];DB.set(skey,{...log,[S.detailEx]:{...log[S.detailEx],sets}});renderDetailSets();return;}
  const sd=t.closest('[data-set-done]');if(sd){const idx=parseInt(sd.dataset.setDone);const skey=`workout:${todayISO()}:${S.detailDay}`;const log=DB.get(skey)||{};const sets=[...(log[S.detailEx]?.sets||[])];if(sets[idx])sets[idx].done=!sets[idx].done;DB.set(skey,{...log,[S.detailEx]:{...log[S.detailEx],sets}});if(sets[idx]?.done){const bestKg=Math.max(0,...sets.filter(s=>s.done&&s.kg).map(s=>parseFloat(s.kg)||0));const bestReps=Math.max(0,...sets.filter(s=>s.done&&s.reps).map(s=>parseInt(s.reps)||0));if(bestKg>0)checkAndSavePR(S.detailEx,bestKg,bestReps);}renderDetailSets();return;}
});
document.getElementById('ex-detail').addEventListener('input',e=>{const t=e.target;if(t.dataset.setKg!==undefined)detailSaveSet(parseInt(t.dataset.setKg),'kg',t.value);if(t.dataset.setReps!==undefined)detailSaveSet(parseInt(t.dataset.setReps),'reps',t.value);});
// ── Tema claro/escuro ──────────────────────────────────────────────
P.moon='M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z';
function applyTheme(t){document.documentElement.classList.toggle('light',t==='light');const btn=document.getElementById('theme-btn');if(btn)btn.innerHTML=t==='light'?ico('sun',16,'#C45A1A')+' Escuro':ico('moon',16,'#7A8898')+' Claro';}
function initTheme(){applyTheme(localStorage.getItem('theme')||'dark');}
initTheme();

// ── Onboarding ─────────────────────────────────────────────────────
function initOnboarding(){if(!localStorage.getItem('onboarding_done')){document.getElementById('onboarding').classList.remove('hidden');}else{document.getElementById('onboarding').classList.add('hidden');}}
document.getElementById('onb-start').addEventListener('click',()=>{localStorage.setItem('onboarding_done','1');const el=document.getElementById('onboarding');el.style.opacity='0';setTimeout(()=>el.classList.add('hidden'),300);});
document.getElementById('theme-btn').addEventListener('click',()=>{const isLight=document.documentElement.classList.contains('light');const next=isLight?'dark':'light';localStorage.setItem('theme',next);applyTheme(next);});

// ── Fotos de progresso ─────────────────────────────────────────────
function compressPhoto(file,cb){const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const max=640;const cv=document.createElement('canvas');let w=img.width,h=img.height;if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>max){w=Math.round(w*max/h);h=max;}cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);cb(cv.toDataURL('image/jpeg',.5));};img.src=e.target.result;};r.readAsDataURL(file);}
function renderPhotos(){const photos=DB.get('progress-photos')||[];const thumbs=photos.map((p,i)=>`<div class="photo-thumb"><img src="${p.src}" loading="lazy"><div class="photo-date">${p.date}</div><button class="photo-del" data-del-photo="${i}">✕</button></div>`).join('');return`<div class="sec-head"><span class="sec-title">Fotos de Progresso</span><span style="font-size:.68rem;color:var(--tx2)">${photos.length}/20</span></div><div class="photo-grid">${thumbs}<button class="photo-add-btn" data-add-photo>${ico('plus',20,'#7A8898')}<span>Adicionar</span></button></div>`;}
document.getElementById('photo-input').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;compressPhoto(file,src=>{const photos=[...(DB.get('progress-photos')||[])];if(photos.length>=20){alert('Limite de 20 fotos atingido. Remova uma foto antes de adicionar.');return;}photos.unshift({date:todayISO(),src});DB.set('progress-photos',photos);remountContent();});e.target.value='';});

// ── mount com animação ─────────────────────────────────────────────
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./service-worker.js').catch(()=>{});});}
initOnboarding();
mount();
</script>
